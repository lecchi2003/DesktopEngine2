<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Desktop Engine V1.5 - Taskbar StartMenu Showcase</title>
    <link rel="stylesheet" href="./css/core.css?v=3">
    <link rel="stylesheet" href="./css/components.css?v=3">
    <link rel="stylesheet" id="desktop-theme-stylesheet" href="./css/themes/theme-win11.css?v=3">
</head>

<body>
    <div id="app" data-menubar="none">
        <div id="menubar"></div>
        <div id="desktop">
            <div id="windows"></div>
        </div>
        <div id="taskbar">
            <button class="taskStart" id="startBtn">Menu</button>
            <button class="taskShowDesktop" id="showDesktop" title="Mostrar Área de Trabalho">🖥️</button>
            <div class="taskWindows" id="taskWindows"></div>
            <div class="clock" id="clock"></div>
        </div>
    </div>

    <script type="module">
        import { Framework } from './core.js';
        import { Desktop } from './desktop.js';
        import {
            StartMenu, ContextMenu, bindContextMenu, TreeView, Tabs, Modal, WebView, DraggableList, DataGrid,
            Form, Input, Textarea, Select, Checkbox, Toggle, Button, MenuBar,
            Grid, Card, Row, Col, Badge, ProgressBar, Table, createElement, printElement,
            Alert, Spinner, Toast, Accordion, Drawer, Breadcrumbs, Stepper,
            Slider, RadioGroup, Autocomplete, Tooltip, Avatar, Carousel, Skeleton
        } from './ui.js';

        // Inicializa o desktop na posição escolhida
        Desktop.init({
            windowsContainerId: "windows",
            taskbarContainerId: "taskWindows",
            taskbarPosition: "bottom", // Pode ser 'top', 'bottom', 'left', 'right'
            menubarPosition: "none",   // Inicia integrado ao menu iniciar
            startButtonId: "startBtn",
            showDesktopButton: true
        });

        // --- ESTRUTURA GLOBAL DE MENUS ---
        const globalSystemMenus = [
            {
                label: "📐 Exemplos de Telas",
                items: [
                    { label: "⚡ 1. Criação Direta (Inline)", action: () => window.location.href = 'index-direct.html' },
                    { label: "📦 2. Lazy Loading Modular", action: () => window.location.href = 'index-lazy.html' },
                    { label: "🏭 3. Factory / Geradores", action: () => window.location.href = 'index-factory.html' },
                    { label: "🏛️ 4. Classes ES6 (OOP)", action: () => window.location.href = 'index-class.html' },
                    { label: "📄 5. Templates HTML Puro", action: () => window.location.href = 'index-template.html' },
                    "separator",
                    { label: "Hub de Arquiteturas de Telas", screen: "hub_arquiteturas" },
                    "separator",
                    { label: "🖥️ Layout macOS (index.html)", action: () => window.location.href = 'index.html' },
                    { label: "🪟 Layout Windows (index2.html) [Atual]", action: () => Desktop.openScreen("hub_arquiteturas") },
                    { label: "📚 Documentação Oficial", action: () => window.location.href = 'docs.html' }
                ]
            },
            "separator",
            {
                label: "Módulos",
                items: [
                    { label: "Hub de Arquiteturas", screen: "hub_arquiteturas" },
                    "separator",
                    { label: "📊 Relatórios em Background (Workers)", screen: "background_reports" },
                    { label: "🪟 Janelas Modais Filhas (Dialogs)", screen: "child_modal_demo" },
                    { label: "⏱️ Monitor de Ciclo de Vida (Hooks)", screen: "lifecycle_demo" },
                    { label: "🛍️ CRUD de Produtos (API Python)", screen: "crud_api" },
                    { label: "Editor de Documentos (Window MenuBar)", screen: "editor" },
                    { label: "Painel de Controle (Lazy)", screen: "dashboard" },
                    { label: "Listagem Avançada (DataGrid) (Lazy)", screen: "datagrid" },
                    { label: "Navegador Web (Window MenuBar)", screen: "browser" },
                    { label: "Formulários e Cadastros", screen: "forms" },
                    { label: "Gerenciador de Tarefas", screen: "tasks" },
                    { label: "Showcase de Componentes", screen: "showcase" }
                ]
            },
            "separator",
            {
                label: "Exibir",
                items: [
                    { label: "Organizar Janelas em Grade", action: () => Desktop.arrangeWindows() },
                    { label: "Mostrar Área de Trabalho", action: () => Desktop.showDesktop() }
                ]
            },
            "separator",
            {
                label: "Sistema",
                items: [
                    {
                        label: "Preferências",
                        items: [
                            {
                                label: "📱 Modo Responsivo",
                                items: [
                                    { label: "📱 Forçar Modo Mobile (Empilhado)", action: () => Desktop.setMobileMode("mobile") },
                                    { label: "🖥️ Forçar Modo Desktop (Flutuante)", action: () => Desktop.setMobileMode("desktop") },
                                    { label: "🔄 Detecção Automática (Viewport)", action: () => Desktop.setMobileMode("auto") }
                                ]
                            },
                            {
                                label: "📌 Posição da Barra de Tarefas",
                                items: [
                                    { label: "⬇️ Rodapé (Padrão)", action: () => Desktop.setTaskbarPosition("bottom") },
                                    { label: "⬆️ Topo", action: () => Desktop.setTaskbarPosition("top") },
                                    { label: "⬅️ Esquerda", action: () => Desktop.setTaskbarPosition("left") },
                                    { label: "➡️ Direita", action: () => Desktop.setTaskbarPosition("right") }
                                ]
                            },
                            {
                                label: "🧭 Exibição do MenuBar",
                                items: [
                                    { label: "🪟 Barra Separada (Global)", action: () => Desktop.setMenuBarMode("separate") },
                                    { label: "🔘 Integrado ao Menu Iniciar", action: () => Desktop.setMenuBarMode("startmenu") },
                                    "separator",
                                    { label: "⬆️ Posicionar no Topo", action: () => Desktop.setMenuBarPosition("top") },
                                    { label: "⬇️ Posicionar no Rodapé", action: () => Desktop.setMenuBarPosition("bottom") },
                                    { label: "⬅️ Posicionar na Esquerda", action: () => Desktop.setMenuBarPosition("left") },
                                    { label: "➡️ Posicionar na Direita", action: () => Desktop.setMenuBarPosition("right") }
                                ]
                            },
                            {
                                label: "Look and Feel (Aparência do SO)",
                                items: [
                                    {
                                        label: "📱 & 💻 Modernos & Translúcidos",
                                        items: [
                                            { label: "✨ Padrão (DesktopEngine)", action: () => Desktop.setLookAndFeel("default") },
                                            { label: "🍎 Aqua Frosted (Vidro Fosco)", action: () => Desktop.setLookAndFeel("aqua-frosted") },
                                            { label: "🪟 Fluent Acrylic (Acrílico)", action: () => Desktop.setLookAndFeel("fluent-acrylic") },
                                            { label: "🤖 Material Tonal (Dynamic)", action: () => Desktop.setLookAndFeel("material-tonal") },
                                            { label: "🍏 Cupertino Touch (Fluid)", action: () => Desktop.setLookAndFeel("cupertino-touch") },
                                            { label: "🌌 One Touch (Curvas)", action: () => Desktop.setLookAndFeel("one-touch") },
                                            { label: "🔲 Flat Tiles (Modern UI)", action: () => Desktop.setLookAndFeel("flat-tiles") }
                                        ]
                                    },
                                    {
                                        label: "🥽 & 🫧 Espacial & Tátil",
                                        items: [
                                            { label: "🥽 Spatial Glass (Imersivo)", action: () => Desktop.setLookAndFeel("spatial-glass") },
                                            { label: "🫧 Neumorphism (Soft UI)", action: () => Desktop.setLookAndFeel("neumorphism") },
                                            { label: "⚡ Tactical HUD (Cyberdeck)", action: () => Desktop.setLookAndFeel("tactical-hud") }
                                        ]
                                    },
                                    {
                                        label: "☕ Ecossistema Swing & Java",
                                        items: [
                                            { label: "☕ Steel Metal (Classic Swing)", action: () => Desktop.setLookAndFeel("steel-metal") },
                                            { label: "🌊 Ocean Metal (Steel Blue)", action: () => Desktop.setLookAndFeel("ocean-metal") },
                                            { label: "✨ Nimbus Vector (Vibrant)", action: () => Desktop.setLookAndFeel("nimbus-vector") },
                                            { label: "🎨 Modern IDE (Studio Dark/Light)", action: () => Desktop.setLookAndFeel("flatlaf-ide") },
                                            { label: "🌿 Modena Soft (Enterprise)", action: () => Desktop.setLookAndFeel("modena-soft") },
                                            { label: "🔷 Caspian Slate (Dark Blue)", action: () => Desktop.setLookAndFeel("caspian-dark") }
                                        ]
                                    },
                                    {
                                        label: "🕹️ Clássicos & Retro 3D",
                                        items: [
                                            { label: "🟡 Yellow Tab (Media OS)", action: () => Desktop.setLookAndFeel("yellow-tab") },
                                            { label: "🪟 Modern Glass (Centro)", action: () => Desktop.setLookAndFeel("win11") },
                                            { label: "🪟 Modern Glass 2 (Flutuante)", action: () => Desktop.setLookAndFeel("win11-2") },
                                            { label: "🕹️ Retro 3D (Chanfrado)", action: () => Desktop.setLookAndFeel("retro-3d") },
                                            { label: "🔵 Luna Classic (Azul & Verde)", action: () => Desktop.setLookAndFeel("luna-blue") },
                                            { label: "🪟 Aero Glass (Translúcido)", action: () => Desktop.setLookAndFeel("aero-glass") },
                                            { label: "⬛ Dark Slate Cube (Workstation)", action: () => Desktop.setLookAndFeel("next-dark") },
                                            { label: "💾 Workbench Retro (Topaz)", action: () => Desktop.setLookAndFeel("workbench-boing") },
                                            { label: "🍏 Platinum Classic (Monocromático)", action: () => Desktop.setLookAndFeel("platinum-classic") },
                                            { label: "💿 Brushed Metal (Classic)", action: () => Desktop.setLookAndFeel("brushed-metal") },
                                            { label: "💿 Brushed Metal 2 (Sophisticated)", action: () => Desktop.setLookAndFeel("brushed-metal-2") },
                                            { label: "🟦 Warp Enterprise (Cobalt)", action: () => Desktop.setLookAndFeel("warp-enterprise") }
                                        ]
                                    },
                                    {
                                        label: "🐧 Desktops Unix & Abertos",
                                        items: [
                                            { label: "🟠 Aubergine Orange (Humanist)", action: () => Desktop.setLookAndFeel("aubergine-orange") },
                                            { label: "🕊️ Pantheon Pure (Light Minimal)", action: () => Desktop.setLookAndFeel("pantheon-pure") },
                                            { label: "🚀 Cosmic Teal (Modern Desktop)", action: () => Desktop.setLookAndFeel("cosmic-teal") },
                                            { label: "🪟 Tiling Grid (Minimal Tiling)", action: () => Desktop.setLookAndFeel("tiling-grid") },
                                            { label: "🐭 Greybird Lite (Lightweight)", action: () => Desktop.setLookAndFeel("greybird-lite") },
                                            { label: "🌌 Fusion Neon (Compositor)", action: () => Desktop.setLookAndFeel("e-fusion") },
                                            { label: "⬛ X11 Dark Box (NeXT-Style)", action: () => Desktop.setLookAndFeel("x11-box") },
                                            { label: "🟣 Motif Panel (UNIX CDE)", action: () => Desktop.setLookAndFeel("motif-panel") },
                                            { label: "🐧 Adwaita Slate (Clean Flat)", action: () => Desktop.setLookAndFeel("adwaita-slate") },
                                            { label: "⚙️ Breeze Plasma (Glass Glow)", action: () => Desktop.setLookAndFeel("breeze-plasma") }
                                        ]
                                    },
                                    {
                                        label: "💻 Console & Sci-Fi",
                                        items: [
                                            { label: "📟 DOS TUI (Text Console)", action: () => Desktop.setLookAndFeel("turbo-tui") },
                                            { label: "⚡ Cyber Neon (Matrix HUD)", action: () => Desktop.setLookAndFeel("cyberpunk-neon") }
                                        ]
                                    },
                                    {
                                        label: "🎨 Ilustração & Cartoon",
                                        items: [
                                            { label: "✏️ Comic Doodle (Pastel Sketch)", action: () => Desktop.setLookAndFeel("comic-doodle") }
                                        ]
                                    }
                                ]
                            },
                        ]
                    },
                    "separator",
                    { label: "Sobre (Lazy Load)", screen: "sobre" }
                ]
            }
        ];

        // Instancia o Menu Iniciar
        StartMenu({
            buttonId: "startBtn",
            menus: globalSystemMenus
        });

        // Instancia a Barra de Menus Global
        MenuBar({
            containerId: "menubar",
            position: "none",
            menus: globalSystemMenus
        });

        Desktop.setContextMenu([
            { label: "Hub de Arquiteturas de Telas", action: () => Desktop.openScreen("hub_arquiteturas") },
            "separator",
            { label: "Nova Anotação Rápida", action: () => abrirAnotacao() },
            "separator",
            { label: "Abrir Painel (Lazy)", action: () => Desktop.openScreen("dashboard") },
            { label: "Abrir DataGrid (Lazy)", action: () => Desktop.openScreen("datagrid") },
            { label: "Showcase Completo", action: () => Desktop.openScreen("showcase") }
        ]);

        // --- TELAS DO SHOWCASE ---

        // 1. Tela Multi-instância (Post-it / Anotação)
        let anotacaoCount = 1;
        function abrirAnotacao() {
            const AnotacaoScreen = {
                title: `Anotação #${anotacaoCount++}`,
                icon: "📝",
                width: 320,
                height: 260,
                singleInstance: false, // Pode abrir infinitas!
                state: { texto: "" },
                view() {
                    return createElement("div", "flex-col", [
                        Textarea({
                            bind: "texto",
                            instance: this,
                            placeholder: "Digite sua anotação...",
                            style: "height: 100%; display: flex; flex-direction: column; flex: 1;",
                            inputStyle: "flex: 1; resize: none; height: 100%;"
                        })
                    ]);
                }
            };
            Desktop.open(Framework.createWindow(AnotacaoScreen, `anotacao_${Date.now()}`, Desktop));
        }

        // 2. Telas Modulares são carregadas sob demanda da pasta ./screens/
        // (EditorScreen, BrowserScreen, DashboardScreen, DataGridScreen e SobreScreen estão em /screens)

        const TaskScreen = {
            title: "Gerenciador de Tarefas",
            icon: "✅",
            width: 450,
            height: 500,
            singleInstance: true,
            state: {
                tarefas: [
                    "Finalizar relatório mensal",
                    "Reunião de alinhamento com a diretoria",
                    "Aprovar pagamentos do setor de TI",
                    "Revisar arquitetura do sistema v0.3",
                    "Planejar confraternização da equipe"
                ]
            },
            actions: {
                reorder: [async (ctx, next, newItems) => {
                    ctx.instance.setStatus("Ordem salva: " + new Date().toLocaleTimeString());
                }]
            },
            view() {
                return createElement("div", "", [
                    Card({
                        title: "Priorize arrastando (Drag & Drop)", children: [
                            DraggableList({ bindItems: "tarefas", onReorder: "reorder", instance: this })
                        ]
                    })
                ]);
            }
        };

        const FormsScreen = {
            title: "Cadastro Avançado",
            icon: "📝",
            width: 600,
            height: 550,
            singleInstance: true,
            status: "Aguardando preenchimento",
            state: {
                nome: "", dataNasc: "", salario: "", senioridade: "pleno", ativo: true
            },
            actions: {
                salvar: [async (ctx) => {
                    ctx.instance.openModal({
                        title: "Confirmar Inclusão",
                        children: (modal) => [
                            createElement("p", "", [`Deseja salvar o funcionário ${ctx.state.nome}?`]),
                            Button({
                                text: "Sim, salvar", onClick: () => {
                                    Desktop.notify("Salvo com sucesso!", "success");
                                    ctx.instance.setStatus(`Salvo em ${new Date().toLocaleTimeString()}`);
                                    modal.close();
                                }, variant: "success"
                            })
                        ]
                    });
                }]
            },
            view() {
                return createElement("div", "", [
                    Card({
                        title: "Dados Pessoais", children: [
                            Grid({
                                columns: 2, children: [
                                    Input({ label: "Nome Completo", bind: "nome", instance: this }),
                                    Input({ label: "Data de Nascimento", bind: "dataNasc", instance: this, type: "date" })
                                ]
                            }),
                            Grid({
                                columns: 2, children: [
                                    Input({ label: "Pretensão Salarial", bind: "salario", instance: this, type: "number" }),
                                    Select({
                                        label: "Senioridade", bind: "senioridade", instance: this, options: [
                                            { label: "Júnior", value: "junior" },
                                            { label: "Pleno", value: "pleno" },
                                            { label: "Sênior", value: "senior" }
                                        ]
                                    })
                                ]
                            }),
                            Row({
                                children: [
                                    Toggle({ label: "Funcionário Ativo", bind: "ativo", instance: this })
                                ]
                            })
                        ]
                    }),
                    createElement("br", "", []),
                    Button({ text: "Salvar Cadastro", onClick: "salvar", instance: this, variant: "primary" })
                ]);
            }
        };

        const ComponentShowcaseScreen = {
            title: "Showcase de Componentes UI",
            icon: "✨",
            width: 850,
            height: 600,
            singleInstance: true,
            state: {
                step: 0,
                volume: 50,
                laf: Desktop.getLookAndFeel ? Desktop.getLookAndFeel() : "default",
                taskbarPos: Desktop.getTaskbarPosition ? Desktop.getTaskbarPosition() : "bottom",
                menubarPos: Desktop.getMenuBarPosition ? Desktop.getMenuBarPosition() : "none",
                pais: ["Brasil"],
                menuLateral: false
            },
            onMount() {
                this.state.laf = Desktop.getLookAndFeel ? Desktop.getLookAndFeel() : "default";
                this.state.taskbarPos = Desktop.getTaskbarPosition ? Desktop.getTaskbarPosition() : "bottom";
                this.state.menubarPos = Desktop.getMenuBarPosition ? Desktop.getMenuBarPosition() : "none";

                this._unsubEvents = [
                    EventBus.on("laf:change", (l) => { this.state.laf = l; }),
                    EventBus.on("taskbar:positionchange", (p) => { this.state.taskbarPos = p; }),
                    EventBus.on("menubar:positionchange", (m) => { this.state.menubarPos = m; })
                ];
            },
            onDestroy() {
                if (this._unsubEvents) {
                    this._unsubEvents.forEach(unsub => unsub && unsub());
                }
            },
            actions: {
                nextStep: [async (ctx) => {
                    if (ctx.state.step < 3) ctx.state.step++;
                    Toast({ message: "Avançou para o passo " + (ctx.state.step + 1), type: "info" });
                }],
                prevStep: [async (ctx) => {
                    if (ctx.state.step > 0) ctx.state.step--;
                }],
                toggleDrawer: [async (ctx) => {
                    ctx.state.menuLateral = !ctx.state.menuLateral;
                }],
                salvarTudo: [async (ctx) => {
                    Toast({ message: "Dados do showcase salvos no sistema!", type: "success" });
                }],
                abrirModalLocal: [async (ctx) => {
                    ctx.instance.openModal({
                        title: "Modal Local",
                        children: (modal) => [
                            createElement("p", "", ["Este modal está restrito aos limites da janela."]),
                            Button({ text: "Fechar", onClick: () => modal.close() })
                        ]
                    });
                }],
                abrirModalGlobal: [async (ctx) => {
                    Desktop.openModal({
                        title: "Modal Global",
                        children: (modal) => [
                            createElement("p", "", ["Este modal se sobrepõe a TODAS as janelas e ao Desktop."]),
                            Button({ text: "Fechar", onClick: () => modal.close() })
                        ]
                    });
                }]
            },
            view() {
                // Aplica o Look and Feel se tiver sido modificado pelo select da tela
                if (Desktop && typeof Desktop.setLookAndFeel === 'function' && Desktop.getLookAndFeel() !== this.state.laf) {
                    Desktop.setLookAndFeel(this.state.laf);
                }

                // Aplica a posição da Barra de Tarefas se tiver sido modificada pelo select
                if (Desktop && typeof Desktop.setTaskbarPosition === 'function' && Desktop.getTaskbarPosition() !== this.state.taskbarPos) {
                    Desktop.setTaskbarPosition(this.state.taskbarPos);
                }

                // Aplica a posição / modo do MenuBar se tiver sido modificada pelo select
                if (Desktop && typeof Desktop.setMenuBarPosition === 'function' && Desktop.getMenuBarPosition() !== this.state.menubarPos) {
                    Desktop.setMenuBarPosition(this.state.menubarPos);
                }

                return createElement("div", "", [
                    // GRUPO 2: Drawer e Breadcrumbs
                    Drawer({
                        bind: "menuLateral", side: "left", instance: this, content: [
                            createElement("h3", "", ["Menu do Showcase"]),
                            createElement("p", "", ["Este é um painel off-canvas integrado ao state."])
                        ]
                    }),
                    Breadcrumbs({
                        items: [
                            { label: "Módulos", action: () => Toast({ message: "Você clicou no breadcrumb", type: "info" }) },
                            { label: "Showcase UI" }
                        ]
                    }),

                    Row({
                        children: [
                            Col({
                                style: "flex: 1;", children: [
                                    createElement("h2", "", ["Painel de Elementos Visuais"]),
                                ]
                            }),
                            Row({
                                style: "gap: 8px;", children: [
                                    Button({ text: "Modal Local", onClick: "abrirModalLocal", instance: this }),
                                    Button({ text: "Modal Global", onClick: "abrirModalGlobal", instance: this, variant: "danger" }),
                                    Button({ text: "Abrir Drawer Esq.", onClick: "toggleDrawer", instance: this })
                                ]
                            })
                        ]
                    }),

                    // GRUPO 2: Stepper
                    Stepper({ steps: ["Configuração", "Preferências", "Visual", "Confirmação"], currentStep: this.state.step }),

                    Row({
                        children: [
                            // Coluna Esquerda
                            Col({
                                style: "flex: 1; margin-right: 16px;", children: [
                                    Card({
                                        title: "Aparência e Look & Feel do Sistema", children: [
                                            Select({
                                                label: "Look and Feel (Design do Sistema)", bind: "laf", instance: this, options: [
                                                    { label: "✨ Padrão (DesktopEngine Modern)", value: "default" },
                                                    { label: "🍎 Aqua Frosted (Vidro Fosco)", value: "aqua-frosted" },
                                                    { label: "🪟 Fluent Acrylic (Acrílico Moderno)", value: "fluent-acrylic" },
                                                    { label: "☕ Steel Metal (Classic Swing)", value: "steel-metal" },
                                                    { label: "🌊 Ocean Metal (Steel Blue)", value: "ocean-metal" },
                                                    { label: "✨ Nimbus Vector (Vibrant)", value: "nimbus-vector" },
                                                    { label: "🎨 FlatLaf IDE (Studio Dark/Light)", value: "flatlaf-ide" },
                                                    { label: "🌿 Modena Soft (Enterprise)", value: "modena-soft" },
                                                    { label: "🔷 Caspian Slate (Dark Blue)", value: "caspian-dark" },
                                                    { label: "🟡 Yellow Tab (Media Style)", value: "yellow-tab" },
                                                    { label: "🕹️ Retro 3D (Chanfrado)", value: "retro-3d" },
                                                    { label: "🔵 Luna Blue (Azul & Verde)", value: "luna-blue" },
                                                    { label: "🪟 Aero Glass (Translúcido)", value: "aero-glass" },
                                                    { label: "⬛ Next Dark (Step Style)", value: "next-dark" },
                                                    { label: "💾 Workbench Boing (Retro Cores)", value: "workbench-boing" },
                                                    { label: "🍏 Platinum Classic (Monocromático)", value: "platinum-classic" },
                                                    { label: "💿 Brushed Metal (Classic)", value: "brushed-metal" },
                                                    { label: "💿 Brushed Metal 2 (Sophisticated)", value: "brushed-metal-2" },
                                                    { label: "🟦 Warp Enterprise (Cobalt)", value: "warp-enterprise" },
                                                    { label: "🟣 Motif Panel (UNIX CDE)", value: "motif-panel" },
                                                    { label: "🐧 Adwaita Slate (Clean Flat)", value: "adwaita-slate" },
                                                    { label: "⚙️ Breeze Plasma (Glass Glow)", value: "breeze-plasma" },
                                                    { label: "📟 Turbo TUI (DOS Console)", value: "turbo-tui" },
                                                    { label: "⚡ Cyberpunk Neon (Matrix HUD)", value: "cyberpunk-neon" },
                                                    { label: "✏️ Comic Doodle (Pastel Sketch)", value: "comic-doodle" }
                                                ]
                                            }),
                                            Grid({
                                                columns: 2, children: [
                                                    Select({
                                                        label: "📌 Posição da Barra de Tarefas", bind: "taskbarPos", instance: this, options: [
                                                            { label: "⬇️ Rodapé (Padrão)", value: "bottom" },
                                                            { label: "⬆️ Topo", value: "top" },
                                                            { label: "⬅️ Esquerda", value: "left" },
                                                            { label: "➡️ Direita", value: "right" }
                                                        ]
                                                    }),
                                                    Select({
                                                        label: "🧭 Exibição / Posição do MenuBar", bind: "menubarPos", instance: this, options: [
                                                            { label: "🔘 Apenas no Menu Iniciar (Padrão)", value: "none" },
                                                            { label: "⬆️ Topo (Barra Separada)", value: "top" },
                                                            { label: "⬇️ Rodapé (Barra Separada)", value: "bottom" },
                                                            { label: "⬅️ Esquerda (Barra Separada)", value: "left" },
                                                            { label: "➡️ Direita (Barra Separada)", value: "right" }
                                                        ]
                                                    })
                                                ]
                                            }),
                                            Slider({ label: "Nível de Intensidade", bind: "volume", min: 0, max: 100, instance: this }),
                                            Autocomplete({ label: "Países de Atuação", bind: "pais", multiple: true, options: ["Brasil", "Estados Unidos", "Alemanha", "França", "Itália", "Japão"], instance: this })
                                        ]
                                    }),

                                    createElement("br", "", []),

                                    Card({
                                        title: "Feedback e Notificações", children: [
                                            // GRUPO 1: Feedback
                                            Alert({ text: "Esta é uma demonstração de todos os novos componentes reunidos.", variant: "success" }),
                                            Row({
                                                style: "align-items: center; gap: 12px;", children: [
                                                    Spinner({ size: "20px", color: "var(--btn-primary)" }),
                                                    createElement("span", "", ["Carregando recursos em segundo plano..."])
                                                ]
                                            })
                                        ]
                                    })
                                ]
                            }),

                            // Coluna Direita
                            Col({
                                style: "flex: 1;", children: [
                                    Card({
                                        title: "Componentes Visuais", children: [
                                            // GRUPO 4: Visuais
                                            Row({
                                                style: "align-items: center; gap: 16px; margin-bottom: 16px;", children: [
                                                    Tooltip({
                                                        position: "top", content: "Administrador Online", children:
                                                            Avatar({ initials: "AD", status: "online", size: 48 })
                                                    }),
                                                    Col({
                                                        children: [
                                                            createElement("strong", "", ["Admin System"]),
                                                            createElement("span", "text-secondary", ["Nível: Acesso Total"])
                                                        ]
                                                    })
                                                ]
                                            }),

                                            createElement("label", "", ["Destaques Recentes (Carousel)"]),
                                            Carousel({
                                                height: "120px",
                                                controlsPosition: "bottom-center",
                                                prevControl: Button({ text: "◀" }),
                                                nextControl: Button({ text: "▶" }),
                                                items: [
                                                    createElement("div", "p-3 text-center", ["Destaque 1"]),
                                                    createElement("div", "p-3 text-center", ["Destaque 2"]),
                                                    createElement("div", "p-3 text-center", ["Destaque 3"]),
                                                    createElement("div", "p-3 text-center", ["Destaque 4"])
                                                ]
                                            }),

                                            createElement("br", "", []),
                                            createElement("label", "", ["Carregamento Simulado (Skeleton)"]),
                                            Skeleton({ width: "100%", height: "40px", shape: "rect" })
                                        ]
                                    }),

                                    createElement("br", "", []),

                                    Card({
                                        title: "Seções Dinâmicas", children: [
                                            // GRUPO 2: Accordion
                                            Accordion({
                                                instance: this, items: [
                                                    { title: "Mais Opções", content: "Aqui poderiam existir sub-configurações." },
                                                    { title: "Ajuda do Sistema", content: "Documentação integrada ao painel de configurações." }
                                                ]
                                            })
                                        ]
                                    })
                                ]
                            })
                        ]
                    }),

                    createElement("br", "", []),

                    // Botões de Navegação do Stepper
                    Row({
                        style: "justify-content: space-between;", children: [
                            Button({ text: "Passo Anterior", onClick: "prevStep", instance: this }),
                            Row({
                                style: "gap: 8px;", children: [
                                    Button({ text: "Avançar Passo", onClick: "nextStep", instance: this }),
                                    Button({ text: "Concluir Setup", onClick: "salvarTudo", instance: this, variant: "primary" })
                                ]
                            })
                        ]
                    })
                ]);
            }
        };

        // 0. Central / Hub de Arquiteturas de Telas
        const HubArquiteturasScreen = {
            title: "Hub de Arquiteturas & Formas de Criação de Telas",
            icon: "📐",
            width: 820,
            height: 560,
            singleInstance: true,
            status: "5 Padrões Arquiteturais Disponíveis",
            state: {},
            view() {
                return createElement("div", "", [
                    Alert({
                        text: "O DesktopEngine suporta múltiplos paradigmas de desenvolvimento para criação de telas. Clique nos cards abaixo para abrir a página dedicada de cada arquitetura!",
                        variant: "info"
                    }),
                    Grid({
                        columns: 2,
                        children: [
                            Card({
                                title: "⚡ 1. Criação Direta (Inline)",
                                children: [
                                    createElement("p", "text-secondary", ["Objetos literais declarados no próprio script. Ideal para post-its, multi-instâncias e utilitários rápidos."]),
                                    Button({ text: "Abrir index-direct.html ↗", onClick: () => window.location.href = 'index-direct.html', variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "📦 2. Lazy Loading Modular",
                                children: [
                                    createElement("p", "text-secondary", ["Arquivos .js isolados na pasta /screens/ carregados sob demanda via ES Modules dynamic import()."]),
                                    Button({ text: "Abrir index-lazy.html ↗", onClick: () => window.location.href = 'index-lazy.html', variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "🏭 3. Factory / Geradores",
                                children: [
                                    createElement("p", "text-secondary", ["Funções geradoras parametrizadas (createCrudScreen, createReportScreen) reduzindo 80% do boilerplate."]),
                                    Button({ text: "Abrir index-factory.html ↗", onClick: () => window.location.href = 'index-factory.html', variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "🏛️ 4. Classes ES6 (OOP)",
                                children: [
                                    createElement("p", "text-secondary", ["Herança com BaseScreen, ciclo de vida (onMount/onDestroy) e methods como actions encapsuladas."]),
                                    Button({ text: "Abrir index-class.html ↗", onClick: () => window.location.href = 'index-class.html', variant: "primary" })
                                ]
                            })
                        ]
                    }),
                    createElement("br", "", []),
                    Grid({
                        columns: 2,
                        children: [
                            Card({
                                title: "📄 5. Templates HTML Puro",
                                children: [
                                    createElement("p", "text-secondary", ["Telas desenhadas diretamente com marcação HTML, Template Strings ou tags <template> nativas."]),
                                    Button({ text: "Abrir index-template.html ↗", onClick: () => window.location.href = 'index-template.html', variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "✨ 6. MenuBar em Janelas",
                                children: [
                                    createElement("p", "text-secondary", ["Cada janela pode ter sua própria barra de menus em cascata com atalhos, ícones e ações reativas."]),
                                    Button({ text: "Abrir Editor com MenuBar ↗", onClick: () => Desktop.openScreen("editor"), variant: "success" })
                                ]
                            })
                        ]
                    }),
                    createElement("br", "", []),
                    Grid({
                        columns: 2,
                        children: [
                            Card({
                                title: "⏱️ 7. Ciclo de Vida (13 Hooks)",
                                children: [
                                    createElement("p", "text-secondary", ["Demonstração interativa dos 13 hooks (beforeMount, onMount, onFocus, beforeClose, onDestroy, etc.)."]),
                                    Button({ text: "Abrir Monitor de Ciclo de Vida ↗", onClick: () => Desktop.openScreen("lifecycle_demo"), variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "🛍️ 8. CRUD com API REST",
                                children: [
                                    createElement("p", "text-secondary", ["Exemplo prático de consumo de API assíncrona com Basic Auth e persistência de dados."]),
                                    Button({ text: "Abrir Gerenciador de Produtos ↗", onClick: () => Desktop.openScreen("crud_api"), variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "🪟 9. Janelas Filhas (Dialogs)",
                                children: [
                                    createElement("p", "text-secondary", ["Sub-janelas modais acopladas à janela mãe com bloqueio local, foco e retorno assíncrono."]),
                                    Button({ text: "Abrir Diálogos Modais ↗", onClick: () => Desktop.openScreen("child_modal_demo"), variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "📊 10. Relatórios em Segundo Plano",
                                children: [
                                    createElement("p", "text-secondary", ["Geração de relatórios pesados e tarefas assíncronas com Web Workers mantendo 60 FPS na UI."]),
                                    Button({ text: "Abrir Relatórios Background ↗", onClick: () => Desktop.openScreen("background_reports"), variant: "success" })
                                ]
                            })
                        ]
                    })
                ]);
            }
        };

        // --- REGISTRO DE TELAS (Screen Registry & Lazy Loading) ---
        Desktop.registerScreens({
            // Hub de Arquiteturas
            "hub_arquiteturas": () => HubArquiteturasScreen,

            // 1. Telas com Lazy Loading nativo (Arquivos isolados em /screens)
            "background_reports": () => import('./screens/BackgroundReportScreen.js'),
            "child_modal_demo": () => import('./screens/ChildModalDemoScreen.js'),
            "lifecycle_demo": () => import('./screens/LifecycleDemoScreen.js'),
            "crud_api": () => import('./screens/ProductsCrudScreen.js'),
            "editor": () => import('./screens/EditorScreen.js'),
            "browser": () => import('./screens/BrowserScreen.js'),
            "dashboard": () => import('./screens/DashboardScreen.js'),
            "datagrid": () => import('./screens/DataGridScreen.js'),
            "sobre": () => import('./screens/SobreScreen.js'),
            "amazon_comic": () => import('./screens/ComicDoodleShowcaseScreen.js'),

            // 2. Telas Registradas Diretamente (Objetos ou inline)
            "tasks": () => TaskScreen,
            "forms": () => FormsScreen,
            "showcase": () => ComponentShowcaseScreen
        });

        // Abre telas iniciais demonstrativas via Screen Registry
        setTimeout(() => {
            Desktop.openScreen("hub_arquiteturas");
            setTimeout(() => Desktop.openScreen("dashboard"), 150);
        }, 100);

    </script>
    <!-- Fix CSS para telas com layout flexível de altura -->
    <style>
        .flex-col {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
    </style>
</body>

</html>
