    <!-- Nota: 'unsafe-inline' em script-src é necessário para os blocos <script type="module"> inline.

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   img-src 'self' data: blob: https:;

                    { label: "✨ Showcase de Animações", screen: "animation_showcase" },
                    "separator",
                    { label: "📟 Terminal Alfa (P2P EventBus)", screen: "terminal_alfa" },
                    { label: "📟 Terminal Beta (P2P EventBus)", screen: "terminal_beta" }

                    { label: "Mostrar Área de Trabalho", action: () => Desktop.showDesktop() }

            {
                label: "Sistema",
                items: [
                    {
                        label: "Preferências",
                        items: [
                            {
                                label: "📱 Modo Responsivo",
                                items: [

                                    { label: "🖥️ Forçar Modo Desktop (Flutuante)", action: () => Desktop.setMobileMode("desktop") },

                                    { label: "🔘 Integrado ao Menu Iniciar", action: () => Desktop.setMenuBarMode("startmenu") },
                                    "separator",
                                    { label: "⬆️ Posicionar no Topo", action: () => Desktop.setMenuBarPosition("top") },

                                                else Desktop.notify("Erro ao analisar JSON de configuração.", "error");

                    { label: "📝 Editor de Documentos", screen: "editor" },
                    { label: "🛍️ CRUD de Produtos", screen: "crud_api" },

                    { label: "Showcase de Componentes UI", screen: "showcase" }

        ];

        // Menu de Contexto da Área de Trabalho (Desktop)
        const desktopContextMenus = [
            { label: "Hub de Arquiteturas de Telas", screen: "hub_arquiteturas" },
            "separator",
            { label: "📊 Relatórios em Background (Workers)", screen: "background_reports" },
            { label: "🪟 Janelas Modais Filhas (Dialogs)", screen: "child_modal_demo" },
            { label: "⏱️ Monitor de Ciclo de Vida (Hooks)", screen: "lifecycle_demo" },
            { label: "🛍️ CRUD de Produtos (API Python)", screen: "crud_api" },
            { label: "Abrir Editor com MenuBar (Lazy)", screen: "editor" },
            { label: "Nova Anotação Rápida", action: () => abrirAnotacao() },
            "separator",
            { label: "📦 Abrir Amazon.com (Showcase Comic)", screen: "amazon_comic" },
            "separator",
            { label: "Abrir Painel (Lazy)", screen: "dashboard" },
            { label: "Abrir DataGrid (Lazy)", screen: "datagrid" },

        // --- INICIALIZAÇÃO HÍBRIDA DO DESKTOP ENGINE (DECLARATIVA + PROGRAMÁTICA) ---
        Desktop.init({
            windowsContainerId: "windows",
            taskbarContainerId: "taskWindows",
            taskbarPosition: "bottom", // Pode ser 'top', 'bottom', 'left', 'right'
            showDesktopButton: true,
            clock: { format: "pt-BR", showSeconds: true },
            menuBar: globalSystemMenus,

                items: desktopContextMenus,
                allowNativeKey: "shift"

        });

        // --- TELAS DO SHOWCASE ---

        // 1. Tela Multi-instância (Post-it / Anotação)
        let anotacaoCount = 1;
        function abrirAnotacao() {
            const AnotacaoScreen = {
                title: `Anotação #${anotacaoCount++}`,
                icon: "📝",
                width: 320,
                height: 260,
                singleInstance: false, // Pode abrir infinitas!
                state: { texto: "" },
                view() {
                    return createElement("div", "flex-col", [
                        Textarea({
                            bind: "texto",
                            instance: this,
                            placeholder: "Digite sua anotação...",
                            style: "height: 100%; display: flex; flex-direction: column; flex: 1;",
                            inputStyle: "flex: 1; resize: none; height: 100%;"
                        })
                    ]);
                }
            };
            Desktop.open(Framework.createWindow(AnotacaoScreen, `anotacao_${Date.now()}`, Desktop));
        }

        // 2. Telas Modulares são carregadas sob demanda da pasta ./screens/
        // (EditorScreen, BrowserScreen, DashboardScreen, DataGridScreen e SobreScreen estão em /screens)

        const TaskScreen = {
            title: "Gerenciador de Tarefas",
            icon: "✅",
            width: 450,
            height: 500,
            singleInstance: true,
            state: {
                tarefas: [
                    "Finalizar relatório mensal",
                    "Reunião de alinhamento com a diretoria",
                    "Aprovar pagamentos do setor de TI",
                    "Revisar arquitetura do sistema v0.3",
                    "Planejar confraternização da equipe"
                ]
            },
            actions: {
                reorder: [async (ctx, next, newItems) => {
                    ctx.instance.setStatus("Ordem salva: " + new Date().toLocaleTimeString());
                }]
            },
            view() {
                return createElement("div", "", [
                    Card({
                        title: "Priorize arrastando (Drag & Drop)", children: [
                            DraggableList({ bindItems: "tarefas", onReorder: "reorder", instance: this })
                        ]
                    })
                ]);
            }
        };

        const FormsScreen = {
            title: "Cadastro Avançado",
            icon: "📝",
            width: 600,
            height: 550,
            singleInstance: true,
            status: "Aguardando preenchimento",
            state: {
                nome: "", dataNasc: "", salario: "", senioridade: "pleno", ativo: true
            },
            actions: {
                salvar: [async (ctx) => {
                    ctx.instance.openModal({
                        title: "Confirmar Inclusão",
                        children: (modal) => [
                            createElement("p", "", [`Deseja salvar o funcionário ${ctx.state.nome}?`]),
                            Button({
                                text: "Sim, salvar", onClick: () => {
                                    Desktop.notify("Salvo com sucesso!", "success");
                                    ctx.instance.setStatus(`Salvo em ${new Date().toLocaleTimeString()}`);
                                    modal.close();
                                }, variant: "success"
                            })
                        ]
                    });
                }]
            },
            view() {
                return createElement("div", "", [
                    Card({
                        title: "Dados Pessoais", children: [
                            Grid({
                                columns: 2, children: [
                                    Input({ label: "Nome Completo", bind: "nome", instance: this }),
                                    Input({ label: "Data de Nascimento", bind: "dataNasc", instance: this, type: "date" })
                                ]
                            }),
                            Grid({
                                columns: 2, children: [
                                    Input({ label: "Pretensão Salarial", bind: "salario", instance: this, type: "number" }),
                                    Select({
                                        label: "Senioridade", bind: "senioridade", instance: this, options: [
                                            { label: "Júnior", value: "junior" },
                                            { label: "Pleno", value: "pleno" },
                                            { label: "Sênior", value: "senior" }
                                        ]
                                    })
                                ]
                            }),
                            Row({
                                children: [
                                    Toggle({ label: "Funcionário Ativo", bind: "ativo", instance: this })
                                ]
                            })
                        ]
                    }),
                    createElement("br", "", []),
                    Button({ text: "Salvar Cadastro", onClick: "salvar", instance: this, variant: "primary" })
                ]);
            }
        };

        const ComponentShowcaseScreen = {
            title: "Showcase de Componentes UI",
            icon: "✨",
            width: 850,
            height: 600,
            singleInstance: true,
            state: {
                step: 0,
                volume: 50,
                laf: Desktop.getLookAndFeel ? Desktop.getLookAndFeel() : "default",
                taskbarPos: Desktop.getTaskbarPosition ? Desktop.getTaskbarPosition() : "bottom",
                menubarPos: Desktop.getMenuBarPosition ? Desktop.getMenuBarPosition() : "top",
                pais: ["Brasil"],
                menuLateral: false
            },
            onMount() {
                // Sincroniza com as configurações reais ativas do Desktop
                this.state.laf = Desktop.getLookAndFeel ? Desktop.getLookAndFeel() : "default";
                this.state.taskbarPos = Desktop.getTaskbarPosition ? Desktop.getTaskbarPosition() : "bottom";
                this.state.menubarPos = Desktop.getMenuBarPosition ? Desktop.getMenuBarPosition() : "top";

                this._unsubEvents = [
                    EventBus.on("laf:change", (l) => { this.state.laf = l; }),
                    EventBus.on("taskbar:positionchange", (p) => { this.state.taskbarPos = p; }),
                    EventBus.on("menubar:positionchange", (m) => { this.state.menubarPos = m; })
                ];
            },
            onDestroy() {
                if (this._unsubEvents) {
                    this._unsubEvents.forEach(unsub => unsub && unsub());
                }
            },
            actions: {
                nextStep: [async (ctx) => {
                    if (ctx.state.step < 3) ctx.state.step++;
                    Toast({ message: "Avançou para o passo " + (ctx.state.step + 1), type: "info" });
                }],
                prevStep: [async (ctx) => {
                    if (ctx.state.step > 0) ctx.state.step--;
                }],
                toggleDrawer: [async (ctx) => {
                    ctx.state.menuLateral = !ctx.state.menuLateral;
                }],
                salvarTudo: [async (ctx) => {
                    Toast({ message: "Dados do showcase salvos no sistema!", type: "success" });
                }],
                abrirModalLocal: [async (ctx) => {
                    const modal = (ctx.instance && typeof ctx.instance.openModal === 'function')
                        ? ctx.instance.openModal({
                            title: "Modal Local",
                            children: (m) => [
                                createElement("p", "", ["Este modal está restrito aos limites da janela."]),
                                Button({ text: "Fechar", onClick: () => m.close() })
                            ]
                        })
                        : Modal({
                            title: "Modal Local",
                            instance: ctx.instance,
                            children: (m) => [
                                createElement("p", "", ["Este modal está restrito aos limites da janela."]),
                                Button({ text: "Fechar", onClick: () => m.close() })
                            ]
                        });
                }],
                abrirModalGlobal: [async (ctx) => {
                    const modal = Desktop.openModal({
                        title: "Modal Global",
                        children: (m) => [
                            createElement("p", "", ["Este modal se sobrepõe a TODAS as janelas e ao Desktop."]),
                            Button({ text: "Fechar", onClick: () => m.close() })
                        ]
                    });
                }]
            },
            view() {
                // Aplica o Look and Feel se tiver sido modificado pelo select da tela
                if (Desktop && typeof Desktop.setLookAndFeel === 'function' && Desktop.getLookAndFeel() !== this.state.laf) {
                    Desktop.setLookAndFeel(this.state.laf);
                }

                // Aplica a posição da Barra de Tarefas se tiver sido modificada pelo select
                if (Desktop && typeof Desktop.setTaskbarPosition === 'function' && Desktop.getTaskbarPosition() !== this.state.taskbarPos) {
                    Desktop.setTaskbarPosition(this.state.taskbarPos);
                }

                // Aplica a posição do MenuBar se tiver sido modificada pelo select
                if (Desktop && typeof Desktop.setMenuBarPosition === 'function' && Desktop.getMenuBarPosition() !== this.state.menubarPos) {
                    Desktop.setMenuBarPosition(this.state.menubarPos);
                }

                return createElement("div", "", [
                    // GRUPO 2: Drawer e Breadcrumbs
                    Drawer({
                        bind: "menuLateral", side: "left", instance: this, content: [
                            createElement("h3", "", ["Menu do Showcase"]),
                            createElement("p", "", ["Este é um painel off-canvas integrado ao state."])
                        ]
                    }),
                    Breadcrumbs({
                        items: [
                            { label: "Módulos", action: () => Toast({ message: "Você clicou no breadcrumb", type: "info" }) },
                            { label: "Showcase UI" }
                        ]
                    }),

                    Row({
                        children: [
                            Col({
                                style: "flex: 1;", children: [
                                    createElement("h2", "", ["Painel de Elementos Visuais"]),
                                ]
                            }),
                            Row({
                                style: "gap: 8px;", children: [
                                    Button({ text: "Modal Local", onClick: "abrirModalLocal", instance: this }),

                        Shortcut({ label: 'Galeria', icon: '🖼️', type: 'folder', action: () => log('Galeria aberta!') }),
                        Shortcut({ label: 'Downloads', icon: '📥', type: 'folder', action: () => log('Downloads aberto!') }),
                        Shortcut({ label: 'Música', icon: '🎵', type: 'folder', action: () => log('Música aberta!') }),
                        Shortcut({ label: 'Configurações', icon: '⚙️', type: 'app', action: () => log('Configurações abertas!') }),
                        Shortcut({ label: 'Link Externo', icon: '🔗', type: 'link', action: () => log('Link externo clicado!') }),
                        Shortcut({ label: 'Desabilitado', icon: '🚫', type: 'app', disabled: true })
                    ]
                });

                // ---- Atalhos de tamanhos diferentes ----
                const bigContainer = ShortcutContainer({
                    shortcutSize: '110px',
                    gap: '12px',
                    height: '160px',
                    scroll: false,
                    alignH: 'center',
                    shortcuts: [
                        Shortcut({ label: 'App Premium', icon: '💎', type: 'app', fontSize: '12px', iconSize: '56px', action: () => log('App Premium clicado!') }),
                        Shortcut({ label: 'Financeiro', icon: '💰', type: 'app', fontSize: '12px', iconSize: '56px', action: () => log('Financeiro clicado!') }),
                        Shortcut({ label: 'Segurança', icon: '🔐', type: 'app', fontSize: '12px', iconSize: '56px', action: () => log('Segurança clicada!') }),
                    ]
                });

                return createElement("div", "shortcut-showcase-root", [
                    // Header
                    createElement("div", "shortcut-showcase-header", [
                        createElement("h3", "shortcut-showcase-title", ["🗂️ Shortcut & ShortcutContainer"]),
                        createElement("p", "text-secondary", ["Atalhos clicáveis organizados em grade — use no Desktop ou dentro de Janelas."])
                    ]),

                    // Seção 1: Container com grade dinâmica e sort
                    createElement("div", "shortcut-section", [
                        createElement("div", "shortcut-section__header", [
                            createElement("span", "shortcut-section__badge", ["Grade Dinâmica"]),
                            createElement("span", "text-secondary", [" — Ordenação: A→Z, scroll e borda ativados"])
                        ]),
                        dynamicContainer,
                        Row({
                            style: "gap:8px; margin-top:8px; flex-wrap:wrap;",
                            children: [
                                Button({
                                    text: "➕ Adicionar Atalho", variant: "primary", onClick: () => {
                                        const names = ['Terminal', 'Monitor', 'Relógio', 'Câmera', 'Scanner', 'Backup'];
                                        const icons = ['💻', '📺', '⏰', '📸', '🔍', '💾'];
                                        const i = Math.floor(Math.random() * names.length);
                                        dynamicContainer.addShortcut(
                                            Shortcut({ label: names[i], icon: icons[i], type: 'app', action: () => log(`${names[i]} clicado!`) })
                                        );
                                        log(`Atalho "${names[i]}" adicionado dinamicamente.`);
                                    }
                                }),
                                Button({ text: "🧹 Limpar Tudo", variant: "danger", onClick: () => { dynamicContainer.clear(); log('Container limpo.'); } }),
                                Button({ text: "🔤 Ordenar A→Z", onClick: () => { dynamicContainer.sort('asc'); log('Ordenado: A→Z'); } }),
                                Button({ text: "🔡 Ordenar Z→A", onClick: () => { dynamicContainer.sort('desc'); log('Ordenado: Z→A'); } }),
                                Button({ text: "📁 Por Tipo", onClick: () => { dynamicContainer.sort('type'); log('Ordenado: por tipo'); } }),
                                Button({ text: "📐 Tamanho 72px", onClick: () => { dynamicContainer.setShortcutSize(72); log('Tamanho: 72px'); } }),
                                Button({ text: "📐 Tamanho 100px", onClick: () => { dynamicContainer.setShortcutSize(100); log('Tamanho: 100px'); } }),
                                Button({
                                    text: "🖥️ Add ao Desktop Real", variant: "primary", onClick: () => {
                                        if (Desktop.shortcutArea) {
                                            Desktop.shortcutArea.addShortcut(
                                                Shortcut({
                                                    label: 'Novo Atalho Dinâmico',
                                                    icon: '🌟',
                                                    type: 'app',
                                                    action: () => alert('Fui criado por uma Janela!')
                                                })
                                            );
                                            log('🌟 Atalho adicionado na Área de Trabalho principal!');
                                        } else {
                                            log('Erro: Container do Desktop não encontrado.');
                                        }
                                    }
                                })
                            ]
                        })
                    ]),

                    // Seção 2: Atalhos grandes centralizados
                    createElement("div", "shortcut-section", [
                        createElement("div", "shortcut-section__header", [
                            createElement("span", "shortcut-section__badge shortcut-section__badge--purple", ["Atalhos Grandes"]),
                            createElement("span", "text-secondary", [" — Alinhamento centralizado, tamanho 110px"])
                        ]),
                        bigContainer
                    ]),

                    // Log de eventos
                    createElement("div", "shortcut-log-panel", [
                        createElement("div", "shortcut-log-panel__title", ["📋 Log de Interações"]),
                        createElement("div", "shortcut-log-panel__body", [
                            ...(this.state.log.length
                                ? this.state.log.map(l => createElement("div", "shortcut-log-entry", [l]))
                                : [createElement("div", "text-secondary", ["Clique em um atalho para ver o evento aqui..."])])
                        ])
                    ])
                ]);
            }
        };

        // --- REGISTRO DE TELAS (Screen Registry & Lazy Loading) ---
        Desktop.registerScreens({
            // Central de Segurança & RBAC Zero-Trust
            "security_rbac": () => import('./screens/SecurityRbacScreen.js'),
            "painel_financeiro_restrito": () => import('./screens/PainelFinanceiroRestritoScreen.js'),

            // Framework Híbrido & ElementBuilder Showcase
            "modern_hybrid": () => import('./screens/ModernHybridShowcaseScreen.js'),

            // Hub de Arquiteturas
            "hub_arquiteturas": () => HubArquiteturasScreen,

            // 1. Telas com Lazy Loading nativo (Arquivos isolados em /screens)
            "background_reports": () => import('./screens/BackgroundReportScreen.js'),
            "child_modal_demo": () => import('./screens/ChildModalDemoScreen.js'),
            "lifecycle_demo": () => import('./screens/LifecycleDemoScreen.js'),
            "crud_api": () => import('./screens/ProductsCrudScreen.js'),
            "editor": () => import('./screens/EditorScreen.js'),
            "browser": () => import('./screens/BrowserScreen.js'),
            "dashboard": () => import('./screens/DashboardScreen.js'),
            "datagrid": () => import('./screens/DataGridScreen.js'),
            "sobre": () => import('./screens/SobreScreen.js'),
            "amazon_comic": () => import('./screens/ComicDoodleShowcaseScreen.js'),

            // 2. Telas Registradas Diretamente (Objetos ou inline)
            "tasks": () => TaskScreen,
            "forms": () => FormsScreen,
            "showcase": () => ComponentShowcaseScreen,
            "animation_showcase": () => AnimationShowcaseScreen,
            "terminal_alfa": () => TerminalAlfaScreen,
            "terminal_beta": () => TerminalBetaScreen,
            "shortcut_showcase": () => ShortcutShowcaseScreen
        });

        // ---- Atalhos de Desktop (declarativo) ----
        // container: injeta direto no elemento de janelas do Desktop
        // passthroughPointer: cliques passam pelo overlay, janelas funcionam normalmente
        // Salvamos em Desktop.shortcutArea para que qualquer janela possa injetar atalhos lá
        Desktop.shortcutArea = ShortcutContainer({
            container: document.getElementById('windows'),
            full: true,
            scroll: false,
            alignH: 'left',
            alignV: 'top',
            shortcutSize: '84px',
            gap: '10px',
            passthroughPointer: true,
            shortcuts: [
                Shortcut({
                    label: 'Segurança & RBAC',
                    icon: '🛡️',
                    type: 'app',
                    action: () => Desktop.openScreen('security_rbac')
                }),
                Shortcut({
                    label: 'Framework Híbrido',
                    icon: '⚡',
                    type: 'app',
                    action: () => Desktop.openScreen('modern_hybrid')
                }),
                Shortcut({
                    label: 'Hub de Arquiteturas',
                    icon: '📐',
                    type: 'app',
                    action: () => Desktop.openScreen('hub_arquiteturas')
                }),
                Shortcut({
                    label: 'Showcase de Componentes',
                    icon: '✨',
                    type: 'app',
                    action: () => Desktop.openScreen('showcase')
                }),
                Shortcut({
                    label: 'Atalhos & Containers',
                    icon: '🗂️',
                    type: 'app',
                    action: () => Desktop.openScreen('shortcut_showcase')
                }),
                Shortcut({
                    label: 'Terminal Alfa',
                    icon: '⌨️',
                    type: 'app',
                    action: () => Desktop.openScreen('terminal_alfa')
                }),
                Shortcut({
                    label: 'Relatórios',
                    icon: '📊',
                    type: 'app',
                    action: () => Desktop.openScreen('background_reports')
                }),
                Shortcut({
                    label: 'Animações',
                    icon: '🎬',
                    type: 'app',
                    action: () => Desktop.openScreen('animation_showcase')
                })
            ]
        });


        // Inicialização da Sessão de Segurança Padrão (RBAC)
        SecurityService.init({
            user: "admin",
            name: "Administrador Geral",
            roles: ["ADMIN"],
            permissions: ["products:view", "products:create", "products:edit", "products:delete", "financeiro:view", "audit:view"]
        }, false);

        // Abre telas iniciais demonstrativas via Screen Registry
        setTimeout(() => {
            const urlParams = typeof window !== 'undefined' && window.location ? new URLSearchParams(window.location.search) : null;
            const screenParam = urlParams ? urlParams.get("screen") : null;
            if (screenParam) {
                Desktop.openScreen(screenParam);
            } else {
                Desktop.openScreen("hub_arquiteturas");
                setTimeout(() => Desktop.openScreen("terminal_alfa"), 150);
                setTimeout(() => Desktop.openScreen("terminal_beta"), 300);
            }
        }, 100);

        // --- 1. DOCK WIDGET GLOBAL (ESTILO LINKEDIN MESSENGER / LOG DE EVENTOS) ---
        const eventLogDock = DockWidget({
            title: "Mensagens & Eventos",
            icon: "💬",
            badge: 3,
            badgeVariant: "danger",
            position: "bottom-right",
            width: "320px",
            height: "300px",
            startMinimized: true,
            controls: { minimize: true, expand: false, close: false },
            headerActions: [
                {
                    icon: "🧹",
                    title: "Limpar logs",
                    action: (dock) => {
                        dock.setContent([]);
                        dock.setBadge(0);
                        Toast({ message: "Histórico de eventos limpo!", type: "info" });
                    }
                },
                {
                    icon: "➕",
                    title: "Simular nova mensagem",
                    action: (dock) => {
                        dock.setBadge(dock.getBadge() + 1);
                        dock.addItem(`📩 Nova mensagem recebida às ${new Date().toLocaleTimeString('pt-BR')}`, true);
                        Toast({ message: "Nova notificação recebida no Dock!", type: "success" });
                    }
                }
            ],
            content: [
                "🚀 Desktop Engine V2.0 inicializado com sucesso (Signals + CSS Modular).",
                "📡 Conexão com EventBus estabelecida.",
                "🔔 Sistema pronto para receber eventos em tempo real."
            ],
            onExpand: (dock) => {
                dock.setBadge(0); // Limpa badge ao abrir/ler mensagens
            }
        });

        // --- 2. FLOAT BUTTON GLOBAL (FAB COM SPEED DIAL DE AÇÕES RÁPIDAS & ARRASTÁVEL) ---
        const quickActionsFab = FloatButton({
            icon: "⚡",
            activeIcon: "✕",
            tooltip: "Ações Rápidas do Desktop (Arrastável)",
            position: "bottom-right",
            variant: "primary",
            draggable: true,
            actions: [
                {
                    icon: "🛡️",
                    label: "Segurança & RBAC",
                    variant: "danger",
                    action: () => Desktop.openScreen('security_rbac')
                },
                {
                    icon: "⚡",
                    label: "Framework Híbrido",
                    variant: "primary",
                    action: () => Desktop.openScreen("modern_hybrid")
                },
                {
                    icon: "✨",
                    label: "Showcase Completo",
                    variant: "primary",
                    action: () => Desktop.openScreen("showcase")
                },
                {
                    icon: "🗂️",
                    label: "Showcase de Atalhos",
                    variant: "secondary",
                    action: () => Desktop.openScreen("shortcut_showcase")
                },
                {
                    icon: "📊",
                    label: "Relatórios Background",
                    variant: "success",
                    action: () => Desktop.openScreen("background_reports")
                },
                {
                    icon: "⏱️",
                    label: "Monitor de Hooks",
                    variant: "info",
                    action: () => Desktop.openScreen("lifecycle_demo")
                },
                {
                    icon: "💬",
                    label: "Alternar Dock Messenger",
                    variant: "surface",
                    action: () => eventLogDock.toggle()
                }
            ]
        });

    </script>
</body>

</html>
